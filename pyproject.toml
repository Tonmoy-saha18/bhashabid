[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bhashabid"
version = "1.0.0"
authors = [
  { name = "Ashikur Rahman Bhuiyan", email = "ashikur.bhuiyan@brainstation-23.com" },
  { name = "Bhashabid Contributors", email = "contributors@bhashabid.org" },
]
description = "The Deterministic Bengali linguistic coprocessor engine & progressive skill layer with a Supervised Self-Learning Distillation Loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Bengali",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
"tools" = ["assets/**/*", "assets/*"]

[project.urls]
"Homepage" = "https://github.com/ashik1291/bhashabid"
"Bug Tracker" = "https://github.com/ashik1291/bhashabid/issues"

[project.scripts]
bhashabid = "tools.cli:main"
bhashabid-mcp = "tools.mcp_server.server:main"
