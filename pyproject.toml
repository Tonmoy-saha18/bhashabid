[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bhashabid"
version = "0.3.0"
authors = [
  { name = "Bhashabid Contributors", email = "contributors@bhashabid.org" },
]
description = "Deterministic Bengali linguistic coprocessor, linter, normalizer, and agent skill layer."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: Bengali",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/bhashabid/bhashabid"
"Bug Tracker" = "https://github.com/bhashabid/bhashabid/issues"

[project.scripts]
bhashabid = "tools.cli:main"
