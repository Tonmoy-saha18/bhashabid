id: CRD-DOM-007
title: Legal Drafting & Contracts (আইনি দলিল, চুক্তিপত্র ও নোটিশ লিখন)
domain: legal_drafting
profile: bd_standard
register: statutory_legal
rule_summary: 'Legal agreements, deeds, and statutory notices demand unambiguous contractual
  terminology and strict formatting. Modern commercial, corporate, and civil contracts
  in Bangladesh are drafted in formal Promito Cholito. Key conventions: (1) Contract
  preamble identifies parties clearly: ''১ম পক্ষ / গ্রহীতা'', ''২য় পক্ষ / দাতা'';
  (2) Operative clauses are numbered as ''শর্তাবলী / শর্তাবলি''; (3) Formal legal
  terminology: ''এই চুক্তি'' (this agreement), ''দ্বিপাক্ষিক সম্মতি'' (mutual consent),
  ''বাতিলযোগ্য'' (voidable), ''আইনগত প্রতিকার'' (legal remedy); (4) Standard modern
  Promito Cholito verb agreement: ''কার্যকর বলে গণ্য হবে'', ''স্বাক্ষর করলেন''. (Avoid
  archaic colonial Sadhu verb endings like ''বলিয়া গণ্য হইবে'', ''করিলেন'' unless
  citing historical deed templates); (5) Attestation section: ''স্বাক্ষীগণের স্বাক্ষর'',
  ''পক্ষগণের স্বাক্ষর ও সীলমোহর''.'
good_examples:
- এই চুক্তির শর্তাবলি উভয় পক্ষের সম্মতিক্রমে আগামী এক বছরের জন্য কার্যকর বলে গণ্য
  হবে।
- উভয় পক্ষ সুস্থ মস্তিষ্কে ও স্বেচ্ছায় এই চুক্তিপত্রে নিজ নিজ স্বাক্ষর করলেন।
bad_examples:
- আমরা দুইজনে মিলে এই চুক্তি বানালাম এবং আমরা দুইজন রাজি আছি।
- যদি কেউ নিয়ম না মানে তবে তাকে কোর্টে নিব।
common_llm_error: LLMs write informal, conversational agreements without binding statutory
  terms.
sources:
- The Contract Act 1872 (Bangladesh Ministry of Law Bengali Translation)
- Bangladesh Legal Form & Precedents Handbook
