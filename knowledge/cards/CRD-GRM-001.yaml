id: CRD-GRM-001
title: Sadhu-Cholito Verb Consistency (গুরুচণ্ডালী দোষ পরিহার)
domain: grammar
profile: all
register: formal
rule_summary: Bengali prose must maintain strict stylistic consistency between Sadhu
  (সাধু) and Cholito (চলিত) registers. Mixing Sadhu verb forms (e.g. করিয়াছিলেন,
  যাইবে) with Cholito forms (e.g. করেছেন, যাবে) within the same discourse is a cardinal
  stylistic defect known as Guru-chandali Dosh.
good_examples:
- তিনি কাজটি করেছিলেন এবং বাড়ি ফিরেছিলেন। (বিশুদ্ধ চলিত)
- তিনি কার্যটি করিয়াছিলেন এবং গৃহে ফিরিয়াছিলেন। (বিশুদ্ধ সাধু)
bad_examples:
- তিনি কাজটি করিয়াছিলেন এবং বাড়ি ফিরেছিলেন। (মিশ্রিত / গুরুচণ্ডালী)
- আমরা সেখানে যাব এবং আহার গ্রহণ করিব। (মিশ্রিত)
common_llm_error: LLMs switch between Sadhu and Cholito verb suffixes midway through
  complex compound sentences due to inconsistent context attention.
sources:
- Suniti Kumar Chatterji, The Origin and Development of the Bengali Language, 1926
- Bangla Academy Promito Bangla Bhashar Byakoron, Vol 1
