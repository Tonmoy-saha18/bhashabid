id: CRD-DOM-011
title: Agronomy, Meteorology & Disaster Bulletins (কৃষি সম্প্রসারণ, আবহাওয়া ও দুর্যোগ
  পূর্বাভাস)
domain: Agriculture & Disaster Management
profile: bd_standard
register: formal
confidence: reviewed
rule_summary: Enforce canonical meteorological and agronomic terminology in early
  warnings (মহাবিপদ সংকেত, জলোচ্ছ্বাস, নিম্নচাপ) and crop husbandry (আমন, বোরো, বালাইনাশক
  প্রয়োগ, সুষম সার) in accordance with BMD and DAE standards.
good_examples:
- ঘূর্ণিঝড়ের প্রভাবে উপকূলীয় জেলাসমূহে স্বাভাবিক জোয়ারের চেয়ে ৫-৭ ফুট অধিক উচ্চতার
  বায়ুতাড়িত জলোচ্ছ্বাসের আশঙ্কা রয়েছে।
- চট্টগ্রাম ও কক্সবাজার সমুদ্রবন্দরকে ৮ নম্বর মহাবিপদ সংকেত প্রদর্শন করতে বলা হয়েছে।
- বোরো ধানের চারা রোপণের ১৫-২০ দিন পর প্রথম কিস্তির ইউরিয়া সার উপরিপ্রয়োগ করতে হবে
  এবং মাজরা পোকা দমনে অনুমোদিত বালাইনাশক ব্যবহার আবশ্যক।
bad_examples:
- ঘূর্ণিঝড়ের প্রভাবে উপকূলীয় অঞ্চলে ৫-৭ ফুট উচ্চতার ঝড় বৃদ্ধি দেখা যেতে পারে।
- বন্দরগুলোকে ৮ নম্বর বড় বিপদের সংকেত দেখাতে বলা হয়েছে।
- ধান ক্ষেতের পোকা মারার জন্য বেশি করে ওষুধ প্রয়োগ করতে হবে।
common_llm_error: Translating 'storm surge' literally as 'ঝড় বৃদ্ধি' instead of meteorological
  'জলোচ্ছ্বাস', fabricating informal warning levels ('বড় বিপদ সংকেত' instead of 'মহাবিপদ
  সংকেত'), and using generic 'ওষুধ' for agronomic 'বালাইনাশক/কীটনাশক'.
sources:
- Bangladesh Meteorological Department (BMD) Cyclone Warning Protocol & Terminology
- Department of Agricultural Extension (DAE) Krishi Diary & Crop Manual
- Disaster Management Act 2012 (Official Bengali Text)
