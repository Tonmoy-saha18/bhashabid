id: CRD-TRN-005
title: Article 102 Constitutional Writs Taxonomy & Drafting (সংবিধানের ১০২ অনুচ্ছেদের
  রিট মামলার প্রমিত পরিভাষা)
domain: legal_constitutional
profile: bd_standard
register: statutory_legal
rule_summary: 'Writ petitions under Article 102 of the Bangladesh Constitution operate
  on a clear statutory dual reality: (1) Constitutional Citation (মূল সংবিধানের প্রামাণিক
  সাধু ধারা পাঠ): The 1972 Constitution was adopted in formal Sadhu; statutory quotations
  of Article 102 preserve verbatim phrasing (যাহা করিবার বাধ্যবাধকতা রহিয়াছে, তাহা
  করিবার নির্দেশ অথবা বিরত থাকিবার নির্দেশ); (2) Modern High Court Practice (সুপ্রিম
  কোর্টের আধুনিক প্রমিত চলিত রিট পিটিশন ও প্রেয়ার): Advocates'' pleadings, grounds,
  operative prayers, and judicial reporting in Bengali are drafted in formal Promito
  Cholito (বাধ্য করার জন্য পরমাদেশ, ঘোষণা করা হবে না, তা প্রদর্শনের জন্য রুল নিশি).
  Never mix constitutional Sadhu snippets into the Cholito narrative of the petition
  (গুরুচণ্ডালী দোষ বর্জন আবশ্যক).'
good_examples:
- '[সুপ্রিম কোর্টের আধুনিক প্রমিত চলিত রিট প্রার্থনা]: সংবিধানের ১০২(২)(ক)(১) অনুচ্ছেদের
  অধীন বিবাদীদের আইনগত দায়িত্ব পালনে বাধ্য করার জন্য পরমাদেশ জারির প্রার্থনা।'
- '[সুপ্রিম কোর্টের আধুনিক প্রমিত চলিত রুল নিশি]: বিবাদীর বিতর্কিত বহিষ্কার আদেশটি
  কেন আইনগত কর্তৃত্ববহির্ভূত ঘোষণা করা হবে না, তা প্রদর্শনের জন্য রুল নিশি জারি।'
- '[মূল সংবিধানের ১০২ অনুচ্ছেদের প্রামাণিক ধারা উদ্ধৃতি (বিশুদ্ধ সাধু পাঠ)]: "কোন
  ব্যক্তি বা কর্তৃপক্ষকে... এমন কোন কার্য, যাহা করিবার আইনগত বাধ্যবাধকতা তাঁহার নাই,
  তাহা করা হইতে বিরত থাকিবার অথবা এমন কোন কার্য, যাহা করিবার আইনগত বাধ্যবাধকতা তাঁহার
  রহিয়াছে, তাহা করিবার নির্দেশ প্রদান করিয়া..."'
bad_examples:
- হাইকোর্টে একটা কেস করা হয়েছে যাতে তাকে চাকরি থেকে বাদ না দেয় (Informal and unmaintainable).
- বিবাদীকে সশরীরে হাজির করিবার নির্দেশ দেওয়া হলো এবং তিনি আগামী সপ্তাহে আসবেন। (ভয়ানক
  গুরুচণ্ডালী মিশ্রণ)
- আটক ব্যক্তির ক্ষেত্রে সার্টিওরারি প্রার্থনা করা (Fatal writ category confusion).
common_llm_error: LLMs confuse Mandamus (compelling an act) with Certiorari (quashing
  an act) and lack standard High Court prayer templates.
sources:
- The Constitution of the People's Republic of Bangladesh (Article 102)
- 'Mahmudul Islam: Constitutional Law of Bangladesh (3rd Edition)'
