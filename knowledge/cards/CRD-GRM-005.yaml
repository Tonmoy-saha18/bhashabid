id: CRD-GRM-005
title: 'Bengali Compound Formation (সমাস: দ্বন্দ্ব, দ্বিগু, তৎপুরুষ ও কর্মধারয়)'
domain: grammar
profile: all
register: formal
rule_summary: 'Samas condenses multi-word syntactic phrases (ব্যাসবাক্য) into single
  compound words (সমস্তপদ). Major types: Dwandwa (মা ও বাবা = মা-বাবা), Tatpurush
  (রাজার পুত্র = রাজপুত্র), Karmadharaya (নীল যে পদ্ম = নীলপদ্ম), and Bahubrihi (দশ
  আনন যার = দশানন).'
good_examples:
- পিতা-মাতা (দ্বন্দ্ব সমাস)
- স্মৃতিসৌধ (স্মৃতিরক্ষার্থে সৌধ - মধ্যপদলোপী কর্মধারয়)
bad_examples:
- পিতা এবং মাতা (Uncondensed in formal administrative contexts)
common_llm_error: LLMs often generate overly verbose periphrastic explanations where
  concise standard compound words exist.
sources:
- 'Bangla Academy Promito Bangla Bhashar Byakoron (Vol 1: Samas)'
