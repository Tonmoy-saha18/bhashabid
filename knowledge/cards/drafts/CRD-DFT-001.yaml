id: CRD-DFT-001
title: 'Candidate Rule for Pattern: দ্বারা চালিত'
domain: translation
profile: bd_standard
register: formal
rule_summary: Automatically flagged pattern 'দ্বারা চালিত' requires naturalization to active causal phrasing (e.g. 'পরিচালিত', 'নেতৃত্বে', 'কারণে').
good_examples:
  - খাদ্যপণ্যের মূল্যবৃদ্ধির কারণে মূল্যস্ফীতি বেড়েছে।
  - প্রকল্পটির কাজ বিদ্যুৎ বিভাগের অধীনে পরিচালিত হচ্ছে।
  - প্রধান উপদেষ্টার সভাপতিত্বে অনুষ্ঠিত বৈঠকে এ সিদ্ধান্ত গৃহীত হয়।
bad_examples:
  - মূল্যবৃদ্ধি দ্বারা চালিত মূল্যস্ফীতি।
  - প্রকল্পটি বিদ্যুৎ বিভাগ দ্বারা পরিচালিত।
  - প্রধান উপদেষ্টা দ্বারা সভাপতিত্ব করা বৈঠকে।
common_llm_error: LLMs emit literal English passive calques ('দ্বারা চালিত', 'দ্বারা অনুষ্ঠিত') instead of natural active causal syntax.
